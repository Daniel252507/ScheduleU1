version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: scheduleu-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: horario_uni1
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: America/Bogota
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./INSTALAR_TODO.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - scheduleu-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: scheduleu-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/horario_uni1?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JWT_SECRET: scheduleu-secret-key-2024-universidad-cundinamarca-sistemas-informacion
      JWT_EXPIRATION: "86400000"
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - scheduleu-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: scheduleu-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - scheduleu-net

volumes:
  db_data:

networks:
  scheduleu-net:
    driver: bridge
