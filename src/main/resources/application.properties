spring.config.import=optional:file:./.env[.properties]
# Configuracion del servidor
# En local usa 8080; las plataformas de despliegue (Render, Cloud Run, etc.) inyectan PORT.
server.port=${PORT:8080}
# NO poner context-path /api porque los Controllers ya usan @RequestMapping("/api/...")
# Si se deja /api aqui las URLs serian /api/api/auth/login etc.

# Configuracion de la base de datos.
# En local se usa MySQL (XAMPP/WAMP - root sin contrasena).
# En produccion (Supabase) se define SPRING_DATASOURCE_URL con la cadena de
# PostgreSQL de Supabase. El driver y el dialecto de Hibernate se detectan
# automaticamente a partir de la URL JDBC.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/horario_uni1?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuracion JWT
jwt.secret=scheduleu-secret-key-2024-universidad-cundinamarca-sistemas-informacion
jwt.expiration=86400000

# Inicio de sesion con Google (OAuth 2.0 / OpenID Connect)
# Client ID del proyecto de Google Cloud. Si esta vacio, el endpoint
# /api/auth/google responde que la funcion no esta configurada.
# Los correos no registrados completan su alta como estudiante (codigo y
# semestre) directamente en la aplicacion: no se envian correos.
google.client-id=${GOOGLE_CLIENT_ID:599416100081-n80andjlulc6i2cb79lcvo5cacuer5fo.apps.googleusercontent.com}

# Asistente academico con IA (Google Gemini - Generative Language API).
# La API key se obtiene gratis en Google AI Studio (https://aistudio.google.com/apikey)
# y no requiere tarjeta de credito. Si esta vacia, el endpoint
# /api/asistente/consultar responde que la funcion no esta configurada.
gemini.api-key=${GEMINI_API_KEY:}
gemini.modelo=${GEMINI_MODEL:gemini-3.8-flash}
gemini.modelo-respaldo=${GEMINI_MODEL_RESPALDO:gemini-3.7-flash}
gemini.pensamiento=minimal

# Configuracion de logging
logging.level.org.springframework.security=INFO
logging.level.com.scheduleu=DEBUG

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}