# Configuracion del servidor
# En local usa 8080; las plataformas de despliegue (Render, Cloud Run, etc.) inyectan PORT.
server.port=${PORT:8080}
# NO poner context-path /api porque los Controllers ya usan @RequestMapping("/api/...")
# Si se deja /api aqui las URLs serian /api/api/auth/login etc.

# Configuracion de MySQL (XAMPP/WAMP - root sin contrasena)
spring.datasource.url=jdbc:mysql://localhost:3306/horario_uni1?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Configuracion JWT
jwt.secret=scheduleu-secret-key-2024-universidad-cundinamarca-sistemas-informacion
jwt.expiration=86400000

# Configuracion de correo (SMTP Gmail)
# Las credenciales se pasan por variables de entorno para NO quedar dentro de la imagen.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Enlace de establecimiento de contrasena enviado por correo
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.mail.enabled=${MAIL_ENABLED:true}
app.token.vigencia-horas=48

# Configuracion de logging
logging.level.org.springframework.security=INFO
logging.level.com.scheduleu=DEBUG
